name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # cache: true caches bun's install cache keyed on the lockfile
      # (replaces the hand-rolled actions/cache blocks)
      - uses: oven-sh/setup-bun@v2
        with:
          cache: true

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun run typecheck

      - run: bun run test

      - run: bun run build

      # The extension build (vite app + plasmo packaging + ext-post glue) is
      # otherwise only exercised at release time; build it here so breakage
      # surfaces in PRs, not in a tag build
      - run: bun run ext:build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          cache: true

      - run: bun install --frozen-lockfile

      # Browser binaries (~150MB) keyed on the lockfile that pins the
      # playwright version; the deps below are small apt packages
      - name: Cache playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-playwright-

      - run: bunx playwright install --with-deps chromium

      - run: bun run test:e2e
