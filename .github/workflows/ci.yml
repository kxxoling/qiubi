name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # cache: true caches bun's install cache keyed on the lockfile
      # (replaces the hand-rolled actions/cache blocks)
      - uses: oven-sh/setup-bun@v2
        with:
          cache: true

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun run typecheck

      - run: bun run test

      - run: bun run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          cache: true

      - run: bun install --frozen-lockfile

      - run: npx playwright install --with-deps chromium

      - run: bun run test:e2e
