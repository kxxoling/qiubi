name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Determine tag name
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2

      - name: Cache bun
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Package qBittorrent Web UI bundle
        run: |
          # Bundle as qiubi/public/{index.html,assets}: qBT 5.x serves the
          # alternative UI from the "public" subfolder of the configured path
          # (point qBT at the extracted "qiubi" folder); qBT 4.x has no such
          # convention (point qBT at "qiubi/public" itself).
          # Prune dev/test files that Vite copies from public/.
          rm -rf dist/mockServiceWorker.js
          mkdir -p bundle/qiubi/public
          cp -r dist/. bundle/qiubi/public/
          cd bundle
          zip -r "../qiubi-${{ steps.tag.outputs.name }}.zip" qiubi

      - name: Build Chrome extension
        run: bun run ext:build

      - name: Package Chrome extension
        run: |
          cd build/chrome-mv3-prod
          zip -r "../../qiubi-extension-${{ steps.tag.outputs.name }}.zip" .

      - name: Generate checksums
        run: |
          sha256sum "qiubi-${{ steps.tag.outputs.name }}.zip" > "qiubi-${{ steps.tag.outputs.name }}.zip.sha256"
          sha256sum "qiubi-extension-${{ steps.tag.outputs.name }}.zip" > "qiubi-extension-${{ steps.tag.outputs.name }}.zip.sha256"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: |
            qiubi-${{ steps.tag.outputs.name }}.zip
            qiubi-${{ steps.tag.outputs.name }}.zip.sha256
            qiubi-extension-${{ steps.tag.outputs.name }}.zip
            qiubi-extension-${{ steps.tag.outputs.name }}.zip.sha256

  docker:
    # Independent and parallel: doesn't depend on the zip job (Docker builds on
    # its own; very different steps and artifact size)
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Determine tag name
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          # Strip 'v' prefix for Docker tags (v0.1.0 → 0.1.0)
          VERSION="${TAG#v}"
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.tag.outputs.version }}
            type=semver,pattern={{version}}.{{major}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          dockerfile: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
